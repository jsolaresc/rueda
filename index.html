<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Rueda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050b24;
    --bg-mid: #0c1f5c;
    --beam: rgba(90, 160, 255, .18);
    --gold-1: #f6dd8a;
    --gold-2: #d9b44a;
    --gold-3: #a8822a;
    --red-1: #c8202a;
    --red-2: #8e0f17;
    --rim: #1c1c22;
    --text: #f4f6ff;
    --muted: #9fb0e0;
    --card: rgba(10, 22, 70, .72);
    --card-border: rgba(140, 180, 255, .25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: Inter, system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(80,150,255,.35), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(30,70,200,.45), transparent 70%),
      linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
    background-color: var(--bg-deep);
    overflow-x: hidden;
  }
  /* luces de estadio */
  .beams {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(115deg, transparent 42%, var(--beam) 46%, transparent 50%),
      linear-gradient(65deg, transparent 42%, var(--beam) 46%, transparent 50%),
      linear-gradient(100deg, transparent 15%, rgba(90,160,255,.10) 18%, transparent 21%),
      linear-gradient(80deg, transparent 79%, rgba(90,160,255,.10) 82%, transparent 85%);
  }
  .dots {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
    background-image: radial-gradient(rgba(180,210,255,.7) 1px, transparent 1.5px);
    background-size: 28px 28px;
    mask-image: linear-gradient(180deg, #000 0%, transparent 35%, transparent 65%, #000 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 35%, transparent 65%, #000 100%);
  }
  main {
    position: relative; z-index: 1;
    max-width: 1080px; margin: 0 auto;
    padding: 28px 16px 40px;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 32px;
    align-items: center;
  }
  header { grid-column: 1 / -1; text-align: center; }
  h1 {
    margin: 0;
    font-family: Oswald, Impact, sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 56px);
    letter-spacing: .04em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff6d0, var(--gold-2) 60%, var(--gold-3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.4));
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    aspect-ratio: 1;
  }
  .wheel-wrap::before {
    content: ""; position: absolute; inset: -6%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120,180,255,.35), transparent 65%);
    z-index: -1;
  }
  #wheel { width: 100%; height: 100%; display: block; will-change: transform; }
  .pointer {
    position: absolute; left: 50%; top: -4%;
    width: 15%; transform: translateX(-50%);
    transform-origin: 50% 20%;
    z-index: 2;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.5));
  }
  .pointer.tick { animation: tick .12s ease-out; }
  @keyframes tick {
    0% { transform: translateX(-50%) rotate(0); }
    40% { transform: translateX(-50%) rotate(-14deg); }
    100% { transform: translateX(-50%) rotate(0); }
  }

  .panel { display: flex; flex-direction: column; gap: 16px; }
  .result {
    min-height: 92px;
    border-radius: 16px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(6px);
    text-align: center;
    display: flex; flex-direction: column; justify-content: center;
  }
  .result .label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .result .value {
    margin-top: 4px;
    font-family: Oswald, Impact, sans-serif; font-weight: 700;
    font-size: clamp(22px, 3.4vw, 32px); line-height: 1.1;
    text-transform: uppercase;
  }
  .result.win { border-color: var(--gold-2); box-shadow: 0 0 30px rgba(217,180,74,.35); }
  .result.win .value { color: var(--gold-1); }
  .result.lose { border-color: var(--red-1); box-shadow: 0 0 30px rgba(200,32,42,.45); }
  .result.lose .value { color: #ff6b70; }
  .result.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }

  .counters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .counter {
    border-radius: 16px; padding: 14px 16px;
    border: 1px solid var(--card-border);
    background: var(--card);
  }
  .counter.gold { border-color: rgba(217,180,74,.55); }
  .counter.red { border-color: rgba(200,32,42,.6); }
  .counter .name { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.25; min-height: 2.5em; }
  .counter .num {
    font-family: Oswald, Impact, sans-serif; font-weight: 700;
    font-size: 48px; line-height: 1; margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .counter.gold .num { color: var(--gold-1); }
  .counter.red .num { color: #ff6b70; }
  .counter .pct { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; transition: width .4s ease; }
  .counter.gold .bar > span { background: linear-gradient(90deg, var(--gold-3), var(--gold-1)); }
  .counter.red .bar > span { background: linear-gradient(90deg, var(--red-2), var(--red-1)); }
  .total { text-align: center; color: var(--muted); font-size: 14px; }
  .total strong { color: var(--text); font-variant-numeric: tabular-nums; }

  .buttons { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 14px;
    padding: 16px 18px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    transition: transform .08s ease, filter .15s ease, opacity .15s;
  }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid #8fc0ff; outline-offset: 2px; }
  #spin {
    font-size: 18px; color: #2a1c00;
    background: linear-gradient(180deg, #fff1b8, var(--gold-2) 55%, var(--gold-3));
    box-shadow: 0 4px 0 #6d5418, 0 8px 24px rgba(217,180,74,.35);
  }
  #spin:hover:not(:disabled) { filter: brightness(1.08); }
  #reset {
    font-size: 15px; color: var(--text);
    background: rgba(255,255,255,.08);
    border: 1px solid var(--card-border);
  }
  #reset:hover:not(:disabled) { background: rgba(255,255,255,.14); }
  .odds { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; gap: 24px; padding-top: 20px; }
    .wheel-wrap { max-width: 440px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .result.pop, .pointer.tick { animation: none; }
  }
</style>
</head>
<body>
<div class="beams"></div>
<div class="dots"></div>
<main>
  <header>
    <h1>La Rueda del Torneo</h1>
    <p class="sub">¿Copa o descenso? Que decida la rueda.</p>
  </header>

  <div class="wheel-wrap">
    <svg class="pointer" id="pointer" viewBox="0 0 100 90" aria-hidden="true">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff3c4"/>
          <stop offset=".6" stop-color="#d9b44a"/>
          <stop offset="1" stop-color="#8a6a1f"/>
        </linearGradient>
      </defs>
      <path d="M6 6 H94 L50 86 Z" fill="url(#pg)" stroke="#2a2a30" stroke-width="5" stroke-linejoin="round"/>
      <path d="M20 14 H80 L50 68 Z" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
    </svg>
    <svg id="wheel" viewBox="-250 -250 500 500" role="img" aria-label="Rueda con 10 sectores: 6 Libertadores y Mundial de Clubes, 4 Descenso"></svg>
  </div>

  <section class="panel">
    <div class="result" id="result" aria-live="polite">
      <div class="label">Resultado</div>
      <div class="value" id="resultText">¡Girá la rueda!</div>
    </div>

    <div class="counters">
      <div class="counter gold">
        <div class="name">Libertadores y Mundial de Clubes</div>
        <div class="num" id="countWin">0</div>
        <div class="pct" id="pctWin">0%</div>
        <div class="bar"><span id="barWin"></span></div>
      </div>
      <div class="counter red">
        <div class="name">Descenso</div>
        <div class="num" id="countLose">0</div>
        <div class="pct" id="pctLose">0%</div>
        <div class="bar"><span id="barLose"></span></div>
      </div>
    </div>
    <div class="total">Total de giros: <strong id="total">0</strong></div>

    <div class="buttons">
      <button id="spin" type="button">Girar rueda</button>
      <button id="reset" type="button">Resetear</button>
    </div>
    <p class="odds">10 sectores iguales · 6 Libertadores (60%) · 4 Descenso (40%)</p>
  </section>
</main>

<script>
(() => {
  const WIN = 'Libertadores y Mundial de Clubes';
  const LOSE = 'Descenso';
  // 10 sectores iguales, empezando arriba y en sentido horario: 6 dorados, 4 rojos
  const SEGMENTS = ['W','W','L','W','W','L','W','L','W','L'];
  const N = SEGMENTS.length;
  const STEP = 360 / N;
  const R = 230;           // radio de la cara
  const STORE_KEY = 'rueda-contador-v1';

  const svg = document.getElementById('wheel');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const pt = (deg, r) => {
    const a = (deg - 90) * Math.PI / 180; // 0° = arriba
    return [r * Math.cos(a), r * Math.sin(a)];
  };

  // ---------- dibujar la rueda ----------
  const defs = el('defs', {}, svg);
  defs.innerHTML = `
    <radialGradient id="gGold" cx="0" cy="0" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset=".55" stop-color="#e8c768"/>
      <stop offset="1" stop-color="#b38a2e"/>
    </radialGradient>
    <radialGradient id="gRed" cx="0" cy="0" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2343c"/>
      <stop offset=".6" stop-color="#b3161f"/>
      <stop offset="1" stop-color="#7a0b12"/>
    </radialGradient>
    <linearGradient id="gRim" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset=".5" stop-color="#15151a"/>
      <stop offset="1" stop-color="#2c2c34"/>
    </linearGradient>
    <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset=".5" stop-color="#b89038"/>
      <stop offset="1" stop-color="#f3d77c"/>
    </linearGradient>
    <radialGradient id="gHub" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset=".45" stop-color="#d9b44a"/>
      <stop offset="1" stop-color="#6d5418"/>
    </radialGradient>
    <radialGradient id="gStud" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset=".6" stop-color="#c9a240"/>
      <stop offset="1" stop-color="#5e4712"/>
    </radialGradient>
    <radialGradient id="gShine" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="rgba(255,255,255,.22)"/>
      <stop offset=".5" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>`;

  // aro exterior
  el('circle', { r: 248, fill: 'url(#gEdge)' }, svg);
  el('circle', { r: 244, fill: 'url(#gRim)' }, svg);

  const face = el('g', {}, svg);
  SEGMENTS.forEach((type, i) => {
    const a0 = i * STEP, a1 = (i + 1) * STEP;
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    el('path', {
      d: `M0 0 L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} Z`,
      fill: type === 'W' ? 'url(#gGold)' : 'url(#gRed)',
      stroke: '#5e4712', 'stroke-width': 2
    }, face);

    // texto radial (a lo largo del radio); en la mitad izquierda se da vuelta para que se lea
    const mid = a0 + STEP / 2;
    const r = 140;
    const [tx, ty] = pt(mid, r);
    const flip = mid > 180;
    const rot = flip ? mid + 90 : mid - 90;
    const g = el('g', { transform: `translate(${tx} ${ty}) rotate(${rot})` }, face);
    const lines = type === 'W' ? ['Libertadores', 'y Mundial', 'de Clubes'] : ['Descenso'];
    const lh = 19;
    const t = el('text', {
      'text-anchor': 'middle',
      'font-family': 'Oswald, Impact, sans-serif',
      'font-weight': 700,
      'font-size': type === 'W' ? 17 : 26,
      fill: type === 'W' ? '#1a1206' : '#ffffff',
      style: type === 'L' ? 'paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px' : ''
    }, g);
    lines.forEach((line, k) => {
      const s = el('tspan', { x: 0, y: (k - (lines.length - 1) / 2) * lh + 6, 'data-max': type === 'W' ? 118 : 150 }, t);
      s.textContent = line;
    });
  });

  // si la fuente es más ancha de lo previsto, comprimir el texto para que no se salga del sector
  const fitText = () => face.querySelectorAll('tspan[data-max]').forEach(s => {
    s.removeAttribute('textLength');
    const max = +s.dataset.max;
    if (s.getComputedTextLength() > max) {
      s.setAttribute('textLength', max);
      s.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    }
  });
  fitText();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

  // brillo
  el('circle', { r: R, fill: 'url(#gShine)', 'pointer-events': 'none' }, face);

  // tachas del aro
  for (let i = 0; i < N * 2; i++) {
    const [x, y] = pt(i * STEP / 2, 237);
    el('circle', { cx: x, cy: y, r: 4.6, fill: 'url(#gStud)', stroke: '#2a2a30', 'stroke-width': 1 }, svg);
  }

  // eje central
  el('circle', { r: 38, fill: '#2a2a30' }, svg);
  el('circle', { r: 33, fill: 'url(#gHub)', stroke: '#6d5418', 'stroke-width': 2 }, svg);
  el('circle', { r: 20, fill: 'none', stroke: 'rgba(255,255,255,.35)', 'stroke-width': 1.5 }, svg);

  // ---------- estado ----------
  let counts = { W: 0, L: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved && Number.isFinite(saved.W) && Number.isFinite(saved.L)) counts = saved;
  } catch (e) {}

  const $ = id => document.getElementById(id);
  const resultBox = $('result'), resultText = $('resultText');
  const spinBtn = $('spin'), resetBtn = $('reset'), pointer = $('pointer');

  function renderCounts() {
    const total = counts.W + counts.L;
    $('countWin').textContent = counts.W;
    $('countLose').textContent = counts.L;
    $('total').textContent = total;
    const pw = total ? Math.round(counts.W / total * 1000) / 10 : 0;
    const pl = total ? Math.round(counts.L / total * 1000) / 10 : 0;
    $('pctWin').textContent = pw + '%';
    $('pctLose').textContent = pl + '%';
    $('barWin').style.width = pw + '%';
    $('barLose').style.width = pl + '%';
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(counts)); } catch (e) {}
  }
  renderCounts();

  // ---------- sonido de tic ----------
  let audio;
  function tickSound() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'square'; o.frequency.value = 1400;
      g.gain.setValueAtTime(0.05, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.04);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.05);
    } catch (e) {}
  }
  function tickPointer() {
    pointer.classList.remove('tick');
    void pointer.getBoundingClientRect();
    pointer.classList.add('tick');
  }

  // ---------- giro ----------
  let rotation = 0;
  let spinning = false;
  let raf = 0;
  const setRot = deg => { svg.style.transform = `rotate(${deg}deg)`; };
  const easeOut = t => 1 - Math.pow(1 - t, 4);

  function randomIndex() {
    // aleatorio uniforme con crypto si está disponible
    if (window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / N) * N;
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % N;
    }
    return Math.floor(Math.random() * N);
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultBox.classList.remove('win', 'lose', 'pop');
    resultText.textContent = 'Girando…';

    const idx = randomIndex();
    const jitter = (Math.random() - 0.5) * STEP * 0.7;
    // el sector idx queda bajo el puntero (arriba) cuando rotation ≡ -(centro del sector)
    const targetMod = ((-(idx * STEP + STEP / 2) + jitter) % 360 + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    let delta = targetMod - currentMod;
    if (delta < 0) delta += 360;
    const extraTurns = 5 + Math.floor(Math.random() * 3);
    const start = rotation;
    const end = rotation + extraTurns * 360 + delta;
    const duration = 5200 + Math.random() * 1200;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t0 = performance.now();
    let lastBoundary = Math.floor(start / STEP);

    const frame = now => {
      const t = reduced ? 1 : Math.min(1, (now - t0) / duration);
      const r = start + (end - start) * easeOut(t);
      setRot(r);
      const b = Math.floor((r + STEP / 2) / STEP);
      if (b !== lastBoundary) { lastBoundary = b; tickPointer(); tickSound(); }
      if (t < 1) { raf = requestAnimationFrame(frame); return; }
      rotation = end;
      finish(SEGMENTS[idx]);
    };
    raf = requestAnimationFrame(frame);
  }

  function finish(type) {
    counts[type]++;
    save();
    renderCounts();
    resultText.textContent = type === 'W' ? WIN : LOSE;
    resultBox.classList.add(type === 'W' ? 'win' : 'lose');
    void resultBox.offsetWidth;
    resultBox.classList.add('pop');
    spinning = false;
    spinBtn.disabled = false;
  }

  function reset() {
    cancelAnimationFrame(raf);
    spinning = false;
    spinBtn.disabled = false;
    rotation = 0;
    setRot(0);
    counts = { W: 0, L: 0 };
    save();
    renderCounts();
    resultBox.classList.remove('win', 'lose', 'pop');
    resultText.textContent = '¡Girá la rueda!';
  }

  spinBtn.addEventListener('click', spin);
  resetBtn.addEventListener('click', reset);
})();
</script>
</body>
</html>
